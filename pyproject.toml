[project]
name = "atlas"
version = "0.1.0"
description = "A self-compiling knowledge graph: drop in sources, get a cross-linked Obsidian wiki you can ask questions."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "trafilatura>=1.8",
    # trafilatura imports lxml.html.clean, which lxml 6 split into its own
    # distribution. Without this a fresh install fails at import time.
    "lxml_html_clean>=0.4",
    "fastmcp>=2.0",
    "json-repair>=0.60",
    # Renders the README and vault notes in the `atlas ui` web app.
    "markdown>=3.5",
]

[project.scripts]
atlas = "atlas.cli:main"
atlas-mcp = "atlas.mcp_server:mcp.run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.ui" = ["static/*"]
